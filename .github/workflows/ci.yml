# The gate that makes trunk-based development safe. Make this a required status
# check on `main` in the repository's branch protection settings — without that,
# it is decoration.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21, not 20: shadow-cljs bundles a Closure Compiler built for 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: m2-

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run fmt:check

      - name: Test
        run: npm test
